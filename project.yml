name: Bruce
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  defaultConfig: Debug
  bundleIdPrefix: net.symphonious.bruce

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_TESTABILITY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

fileGroups:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - guides
  - justfile
  - project.yml

targets:
  Bruce_iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info-macOS.plist
          - Assets-macOS.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce
        PRODUCT_NAME: Bruce
        PRODUCT_MODULE_NAME: Bruce
        INFOPLIST_FILE: App/Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconFullBruce

  Bruce_macOS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info-iOS.plist
          - Assets-iOS.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce
        PRODUCT_NAME: Bruce
        PRODUCT_MODULE_NAME: Bruce
        INFOPLIST_FILE: App/Info-macOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BruceTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bruce.app/Bruce"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Bruce_iOS

  BruceTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bruce.app/Contents/MacOS/Bruce"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Bruce_macOS

schemes:
  Bruce:
    build:
      targets:
        Bruce_iOS: all
        Bruce_macOS: all
    run:
      executable: Bruce_macOS

  Bruce-iOS:
    build:
      targets:
        Bruce_iOS: all
    test:
      config: Debug
      targets:
        - BruceTests_iOS

  Bruce-macOS:
    build:
      targets:
        Bruce_macOS: all
    test:
      config: Debug
      targets:
        - BruceTests_macOS
