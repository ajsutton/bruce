name: Bruce
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  defaultConfig: Debug
  bundleIdPrefix: net.symphonious.bruce

configs:
  Debug: debug
  Testing: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_TESTABILITY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

fileGroups:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - guides
  - justfile
  - project.yml

targets:
  Bruce_iOS:
    type: application
    platform: iOS
    preBuildScripts:
      - script: "${SRCROOT}/scripts/check-release-build-number.sh"
        name: Verify Release build number
        basedOnDependencyAnalysis: false
    sources:
      - path: App
        excludes:
          - Info-macOS.plist
          - Assets-macOS.xcassets
    settings:
      base:
        PRODUCT_NAME: Bruce
        PRODUCT_MODULE_NAME: Bruce
        APP_DISPLAY_NAME: Bruce
        INFOPLIST_FILE: App/Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconFullBruce
        SHARED_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)net.symphonious.bruce.shared
      configs:
        Debug:
          APP_DISPLAY_NAME: Bruce Debug
          PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.debug
          CODE_SIGN_ENTITLEMENTS: App/Bruce-iOS-Debug.entitlements
          SHARED_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)net.symphonious.bruce.debug.shared
        Testing:
          APP_DISPLAY_NAME: Bruce Tests
          PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.tests-host
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_ENTITLEMENTS: App/Bruce-iOS.entitlements
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_PROVISIONING_PROFILE}
    dependencies:
      - target: BruceEnergyWidget
        embed: true

  BruceEnergyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - EnergyWidget.entitlements
          - EnergyWidget-Debug.entitlements
          - EnergyWidget-macOS.entitlements
          - EnergyWidget-macOS-Debug.entitlements
      - path: App/WidgetSupport/BruceSharedContainer.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/BruceSharedCredentialLock.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/BruceSharedKeychain.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/BruceSharedHomeAssistant.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/EnergyWidgetKind.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/HomeEnergyWidgetSnapshot.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/HomeEnergyWidgetSnapshotStore.swift
        group: App/WidgetSupport
      - path: App/Localizable.xcstrings
    settings:
      base:
        PRODUCT_NAME: BruceEnergyWidget
        PRODUCT_MODULE_NAME: BruceEnergyWidget
        INFOPLIST_FILE: Widget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SHARED_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)net.symphonious.bruce.shared
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.debug.energy-widget
          CODE_SIGN_ENTITLEMENTS: Widget/EnergyWidget-Debug.entitlements
          SHARED_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)net.symphonious.bruce.debug.shared
        Testing:
          PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.tests-host.energy-widget
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.energy-widget
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_ENTITLEMENTS: Widget/EnergyWidget.entitlements
          PROVISIONING_PROFILE_SPECIFIER: ${IOS_WIDGET_PROVISIONING_PROFILE}

  Bruce_macOS:
    type: application
    platform: macOS
    preBuildScripts:
      - script: "${SRCROOT}/scripts/check-release-build-number.sh"
        name: Verify Release build number
        basedOnDependencyAnalysis: false
    sources:
      - path: App
        excludes:
          - Info-iOS.plist
          - Assets-iOS.xcassets
          - Settings.bundle
    settings:
      base:
        PRODUCT_NAME: Bruce
        PRODUCT_MODULE_NAME: Bruce
        APP_DISPLAY_NAME: Bruce
        INFOPLIST_FILE: App/Info-macOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SHARED_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)net.symphonious.bruce.shared
      configs:
        Debug:
          APP_DISPLAY_NAME: Bruce Debug
          PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.debug
          CODE_SIGN_ENTITLEMENTS: App/Bruce-Debug.entitlements
          SHARED_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)net.symphonious.bruce.debug.shared
        Testing:
          APP_DISPLAY_NAME: Bruce Tests
          PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.tests-host
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_ENTITLEMENTS: App/Bruce.entitlements
          PROVISIONING_PROFILE_SPECIFIER: ${MAC_PROVISIONING_PROFILE}
          ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: BruceEnergyWidget_macOS
        embed: true

  BruceEnergyWidget_macOS:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
          - EnergyWidget.entitlements
          - EnergyWidget-Debug.entitlements
          - EnergyWidget-macOS.entitlements
          - EnergyWidget-macOS-Debug.entitlements
      - path: App/WidgetSupport/BruceSharedContainer.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/BruceSharedCredentialLock.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/BruceSharedKeychain.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/BruceSharedHomeAssistant.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/EnergyWidgetKind.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/HomeEnergyWidgetSnapshot.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/HomeEnergyWidgetSnapshotStore.swift
        group: App/WidgetSupport
      - path: App/Localizable.xcstrings
    settings:
      base:
        PRODUCT_NAME: BruceEnergyWidget
        PRODUCT_MODULE_NAME: BruceEnergyWidget_macOS
        INFOPLIST_FILE: Widget/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        SHARED_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)net.symphonious.bruce.shared
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.debug.energy-widget
          CODE_SIGN_ENTITLEMENTS: Widget/EnergyWidget-macOS-Debug.entitlements
          SHARED_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)net.symphonious.bruce.debug.shared
        Testing:
          PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.tests-host.energy-widget
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.energy-widget
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Developer ID Application
          CODE_SIGN_ENTITLEMENTS: Widget/EnergyWidget-macOS.entitlements
          PROVISIONING_PROFILE_SPECIFIER: ${MAC_WIDGET_PROVISIONING_PROFILE}
          ENABLE_HARDENED_RUNTIME: YES

  BruceUITestHost_iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - BruceApp.swift
          - Info-iOS.plist
          - Info-macOS.plist
          - Assets-macOS.xcassets
          - Settings.bundle
      - path: UITestHost
    settings:
      base:
        PRODUCT_NAME: BruceUITestHost
        PRODUCT_MODULE_NAME: BruceUITestHost
        PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.ui-test-host
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  BruceTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: App/Info-iOS.plist
        buildPhase: resources
      - path: App/Info-macOS.plist
        buildPhase: resources
      - path: App/Bruce.entitlements
        buildPhase: resources
      - path: App/Bruce-Debug.entitlements
        buildPhase: resources
      - path: App/Bruce-iOS.entitlements
        buildPhase: resources
      - path: App/Bruce-iOS-Debug.entitlements
        buildPhase: resources
      - path: Widget/EnergyWidget.entitlements
        buildPhase: resources
      - path: Widget/EnergyWidget-Debug.entitlements
        buildPhase: resources
      - path: Widget/EnergyWidget-macOS.entitlements
        buildPhase: resources
      - path: Widget/EnergyWidget-macOS-Debug.entitlements
        buildPhase: resources
      - path: docs/.well-known/apple-app-site-association
        buildPhase: resources
      - path: project.yml
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bruce.app/Bruce"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Bruce_iOS

  BruceEnergyWidgetTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WidgetTests
      - path: Widget/WidgetDailyEnergyClient.swift
      - path: Widget/WidgetHomeAssistantCredentials.swift
      - path: Widget/WidgetHomeEnergyClient+Snapshot.swift
      - path: Widget/WidgetHomeEnergyClient.swift
      - path: Widget/WidgetHomeEnergyError.swift
      - path: Widget/SourceScopedTaskCoalescer.swift
      - path: Widget/EnergyWidgetFreshnessSchedule.swift
      - path: Widget/EnergyWidgetRefreshReconciliation.swift
      - path: App/WidgetSupport/HomeEnergyWidgetSnapshotStore.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/BruceSharedKeychain.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/BruceSharedHomeAssistant.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/BruceSharedContainer.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/BruceSharedCredentialLock.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/HomeEnergyWidgetSnapshot.swift
        group: App/WidgetSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.energy-widget-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  BruceEnergyWidgetTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WidgetTests
      - path: Widget/WidgetDailyEnergyClient.swift
      - path: Widget/WidgetHomeAssistantCredentials.swift
      - path: Widget/WidgetHomeEnergyClient+Snapshot.swift
      - path: Widget/WidgetHomeEnergyClient.swift
      - path: Widget/WidgetHomeEnergyError.swift
      - path: Widget/SourceScopedTaskCoalescer.swift
      - path: Widget/EnergyWidgetFreshnessSchedule.swift
      - path: Widget/EnergyWidgetRefreshReconciliation.swift
      - path: App/WidgetSupport/HomeEnergyWidgetSnapshotStore.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/BruceSharedKeychain.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/BruceSharedHomeAssistant.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/BruceSharedContainer.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/BruceSharedCredentialLock.swift
        group: App/WidgetSupport
      - path: App/WidgetSupport/HomeEnergyWidgetSnapshot.swift
        group: App/WidgetSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.energy-widget-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO

  BruceTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: App/Info-iOS.plist
        buildPhase: resources
      - path: App/Info-macOS.plist
        buildPhase: resources
      - path: App/Bruce.entitlements
        buildPhase: resources
      - path: App/Bruce-Debug.entitlements
        buildPhase: resources
      - path: App/Bruce-iOS.entitlements
        buildPhase: resources
      - path: App/Bruce-iOS-Debug.entitlements
        buildPhase: resources
      - path: Widget/EnergyWidget.entitlements
        buildPhase: resources
      - path: Widget/EnergyWidget-Debug.entitlements
        buildPhase: resources
      - path: Widget/EnergyWidget-macOS.entitlements
        buildPhase: resources
      - path: Widget/EnergyWidget-macOS-Debug.entitlements
        buildPhase: resources
      - path: docs/.well-known/apple-app-site-association
        buildPhase: resources
      - path: project.yml
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bruce.app/Contents/MacOS/Bruce"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Bruce_macOS

  BruceUITests_iOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      - path: App/BruceAccessibilityIdentifier.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.bruce.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: BruceUITestHost_iOS

schemes:
  Bruce:
    build:
      targets:
        Bruce_iOS: all
        Bruce_macOS: all
    run:
      executable: Bruce_macOS

  Bruce-iOS:
    build:
      targets:
        Bruce_iOS: all
    test:
      config: Testing
      targets:
        - BruceTests_iOS
        - BruceEnergyWidgetTests_iOS

  Bruce-macOS:
    build:
      targets:
        Bruce_macOS: all
    test:
      config: Testing
      targets:
        - BruceTests_macOS
        - BruceEnergyWidgetTests_macOS

  Bruce-UI-Tests:
    build:
      targets:
        BruceUITestHost_iOS: all
    test:
      config: Testing
      targets:
        - BruceUITests_iOS
