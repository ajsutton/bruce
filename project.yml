name: SmartHome
options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  defaultConfig: Debug
  bundleIdPrefix: net.symphonious.smarthome

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_TESTABILITY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

fileGroups:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - guides
  - justfile
  - project.yml

targets:
  SmartHome_iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info-macOS.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.smarthome
        PRODUCT_NAME: Smart Home
        PRODUCT_MODULE_NAME: SmartHome
        INFOPLIST_FILE: App/Info-iOS.plist

  SmartHome_macOS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info-iOS.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.smarthome
        PRODUCT_NAME: Smart Home
        PRODUCT_MODULE_NAME: SmartHome
        INFOPLIST_FILE: App/Info-macOS.plist

  SmartHomeTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.smarthome.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Smart Home.app/Smart Home"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: SmartHome_iOS

  SmartHomeTests_macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.symphonious.smarthome.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Smart Home.app/Contents/MacOS/Smart Home"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: SmartHome_macOS

schemes:
  SmartHome:
    build:
      targets:
        SmartHome_iOS: all
        SmartHome_macOS: all
    run:
      executable: SmartHome_macOS

  SmartHome-iOS:
    build:
      targets:
        SmartHome_iOS: all
    test:
      config: Debug
      targets:
        - SmartHomeTests_iOS

  SmartHome-macOS:
    build:
      targets:
        SmartHome_macOS: all
    test:
      config: Debug
      targets:
        - SmartHomeTests_macOS
