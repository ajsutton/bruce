excluded:
  - .agent-tmp
  - .build
  - .claude
  - .DerivedData-mac
  - .DerivedData-ios
  - .worktrees
  - SmartHome.xcodeproj
  - build
  - scripts

disabled_rules:
  # Layout is owned by swift-format.
  - closure_spacing
  - colon
  - comma
  - function_name_whitespace
  - line_length
  - opening_brace
  - return_arrow_whitespace
  - sorted_imports
  - statement_position
  - trailing_comma
  - trailing_whitespace
  - vertical_whitespace
  - todo

opt_in_rules:
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - file_name
  - first_where
  - force_cast
  - force_try
  - force_unwrapping
  - identical_operands
  - implicit_return
  - last_where
  - legacy_multiple
  - modifier_order
  - private_action
  - private_outlet
  - reduce_into
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

file_length:
  warning: 400
  error: 1000

type_body_length:
  warning: 250
  error: 350

function_body_length:
  warning: 50
  error: 100

cyclomatic_complexity:
  warning: 10
  error: 20

identifier_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 40
    error: 60
  excluded: [id, x, y, i, j]

force_try:
  severity: warning

force_cast:
  severity: warning

force_unwrapping:
  severity: warning

custom_rules:
  todo_issue_reference:
    name: "TODO must reference a GitHub issue"
    regex: '//[^\n]*\b(?i:TODO|FIXME)(?!\(#[0-9]+\))[(:]'
    message: "Use TODO(#N) or FIXME(#N) and reference an open GitHub issue."
    severity: error
