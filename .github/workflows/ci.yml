name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

jobs:
  checks:
    name: Checks
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install tools
        run: bash scripts/install-ci-tools.sh

      - name: Generate Xcode project
        run: just generate

      - name: Format check
        run: just format-check

  test-mac:
    name: Test (macOS)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install tools
        run: bash scripts/install-ci-tools.sh

      - name: Generate Xcode project
        run: just generate

      - name: Test
        run: |
          # Stream logs only after tests finish: slow CI output can otherwise block
          # OSLog's stderr writes inside the app and trigger async test timeouts.
          test_status=0
          just test-mac > "$RUNNER_TEMP/test-mac.log" 2>&1 || test_status=$?
          cat "$RUNNER_TEMP/test-mac.log"
          exit "$test_status"

  test-ios:
    name: Test (iOS)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install tools
        run: bash scripts/install-ci-tools.sh

      - name: Generate Xcode project
        run: just generate

      - name: Test
        run: |
          # Keep test execution independent of CI log-stream backpressure.
          test_status=0
          just test-ios > "$RUNNER_TEMP/test-ios.log" 2>&1 || test_status=$?
          cat "$RUNNER_TEMP/test-ios.log"
          exit "$test_status"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [checks, test-mac, test-ios]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.checks.result }}" != "success" ] \
            || [ "${{ needs.test-mac.result }}" != "success" ] \
            || [ "${{ needs.test-ios.result }}" != "success" ]; then
            echo "One or more required jobs did not succeed:"
            echo "  checks=${{ needs.checks.result }}"
            echo "  test-mac=${{ needs.test-mac.result }}"
            echo "  test-ios=${{ needs.test-ios.result }}"
            exit 1
          fi
